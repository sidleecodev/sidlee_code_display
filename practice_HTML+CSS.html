<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANOTHER ONE</title>

    <!-- CSS -->
    <style>
        p {
            font-size: 18px;
            /* p裡面的文字改成指定大小 */
            font-weight: bold;
            /* p裡面的文字改成指定粗度 */
            color: rgb(206, 16, 190);
            /* 文字顏色 */
        }

        /* 設定某段字型，會自行往下尋找class="自行設定字型名稱(此例為mytext01)"來取代 */
        .mytext01 {
            font-size: 12px;
            font-weight: bold;
            color: rgb(231, 67, 89);
        }

        .mytext02 {
            font-size: 18px;
            font-weight: 600;
            color: rgb(35, 17, 100);
        }

        .mytext03 {
            font-size: 30px;
            font-weight: 1000;
            color: rgb(229, 233, 23);
        }

        .mytext04 {
            color: rgb(177, 97, 5);
        }
    </style>
</head>

<body>
    <!-- ctrl+/ 這是註解 -->

    <!-- ctlorem20，p裡面設定class＝"自行設定字型名稱" -->
    <p class="mytext01">
        大小採取不管小說溝通下載現象積極展開，精采背景以外幫助播放是以一片信箱一家將來生氣私服室內不承擔，有限責任公司學者危機您是身上總是我現在更好網遊快捷，醫院權威還沒，原文不詳精采硬盤衝擊女人開放決策留下水晶一會連接，模組聯繫方式成長事情一台性格篇文章檢測屬。
    </p>

    <!-- p*2 一次生成2行 -->
    <p class="mytext02">手裡等等不要，不行非常，我市。</p>
    <p class="mytext03">這麼多一起谷歌出現官員調查判。</p>

    <!-- 大小標題 -->
    <h1>這是標題1</h1>
    <h2>標題2</h2>
    <h3>標題3</h3>
    <h4>標題4</h4>
    <h5>標題5</h5>
    <h6>標題6</h6>

    <h2>
        <p class="mytext04">紅色試題服裝規範空調種類文件大小，想起。</p>
        <p class="mytext04">轉移自身實用好評只是一台小孩研究風雲差。</p>
    </h2>

    <!-- 插入圖片 img，重新輸入""觸發選項，各式參數參考下方例子 -->
    <img src="image/vector-1760080404104-9dc1fe17c702.avif" alt="" width="300px">
    <p>形式網域名稱西安歌手簽名一級瞬間，數字。</p>
    <img src="image/vector-1785010187502-50a7361c9706.avif" alt="" width="500px" height="1000px">
    <p>事件臺灣人只需最終挑戰友情，改革例如很。</p>
    <img src="image/vector-1786544532526-5a8e6132b1c9.avif" alt="">

    <img src="image/vector-1748759596026-f19631354ed6.avif" alt="" height="900px">
    <img src="image/vector-1787483248966-da904da0b803.avif" alt="">

    <!-- 超連結，href設定連結，target新增視窗，aa之間是超連結名稱
      <a href="超連結" target="_blank(新增超連結頁面)">超連結名稱</a>-->
     <p></p>
    <a href="https://www.google.com/?hl=zh_TW" target="_blank">
        google
    </a>
</body>

</html>
