<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學習筆記</title>
    <link rel="stylesheet" href="css/allcss.css">

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bgcolor);
            color: var(--text-dark);
            font-family: "DotGothic16", sans-serif;
        }

        .wrapper {
            width: 1024px;
            margin-top: 20px;
            margin-left: 30px;
            margin-right: 30px;
            padding: 15px;

            background-color: var(--conbgcolor01);
            border: 1px solid var(--brown-light);
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .banner {
            margin-bottom: 24px;
            padding: 18px;

            background-color: var(--cream);
            border-left: 6px solid var(--matcha);
            border-radius: 10px;
        }

        .banner ul {
            list-style-position: inside;
        }

        .banner li {
            margin-bottom: 10px;
            color: var(--brown-light);
        }

        .banner li:last-child {
            margin-bottom: 0;
        }

        .banner a {
            color: var(--text-dark);
            text-decoration: none;
            font-size: 18px;
            line-height: 1.6;

            padding: 6px 10px;
            border-radius: 6px;

            transition: 0.2s;
        }

        .banner a:hover {
            background-color: var(--hover);
            color: var(--brown-dark);
        }

        @media screen and (max-width: 1024px) {
            .wrapper {
                width: calc(100% - 30px);
                margin-left: 15px;
                margin-right: 15px;
            }

            .mytitle-01 {
                font-size: 28px;
            }

            .mytitle-03 {
                font-size: 22px;
            }

            .banner a {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>
    <div class="mytitle-01">學習筆記列表</div>
    <div class="banner">
        <ul>
            <div class="mytitle-03">9月份</div>

            <li><a href="practice_HTML+CSS.html" target="_blank">HTML+CSS排版練習</a></li>
            <li><a href="quiz01_ai01.html" target="_blank">排版練習01</a></li>
            <li><a href="practice_JavaScript.html" target="_blank">JavaScript語法練習</a></li>
            <li><a href="practice_JSON_travelfood.html" target="_blank">JSON練習-使用opendata travelfood</a></li>
        </ul>
    </div>

    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>

    <div class="wrapper"></div>
    <script>
        // $(".banner").empty();
        const ListDisplay = [
            {
                "month": "9月份",
                "AllLink": [
                    {
                        "title": "HTML+CSS排版練習",
                        "url": "practice_HTML+CSS.html"
                    },
                    {
                        "title": "排版練習01",
                        "url": "quiz01_ai01.html"
                    },
                    {
                        "title": "JavaScript語法練習",
                        "url": "practice_JavaScript.html"
                    },
                    {
                        "title": "JSON練習-使用opendata travelfood",
                        "url": "practice_JSON_travelfood.html"
                    }
                ]
            },
            {
                "month": "10月份",
                "AllLink": [
                    {
                        "title": "Bootstrap練習",
                        "url": "practice_Bootstrap.html"
                    },
                    {
                        "title": "Bootstrap-table練習",
                        "url": "ractice_Bootstrap_tables.html"
                    }
                ]
            }
        ];


        ListDisplay.forEach(function (item) {
            $(".wrapper").append(`<div class="mytitle-01">${item.month}</div>`);
            item.AllLink.forEach(function(link){
                $(".wrapper").append(`<div class="mytitle-03">${link.title}</div>`);
            });
        });
    </script>


</body>

</html>
