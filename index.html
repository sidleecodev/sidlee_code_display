<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="學習成果：整理 HTML、CSS、JavaScript、Bootstrap 等程式練習與作品。">
    <title>學習成果</title>
    <link rel="stylesheet" href="css/allcss.css">
</head>
<body class="learning-home">
    <header class="learning-header">
        <div class="learning-container learning-header-inner">
            <a class="learning-brand" href="index.html">學習成果</a>
            <nav class="learning-nav" aria-label="內容分類">
                <a href="#learning" class="is-active">學習</a>
                <a href="#works">作品</a>
            </nav>
        </div>
    </header>

    <div class="learning-intro learning-container">
        <h1>學習成果</h1>
        <p>記錄程式學習過程，整理練習與實作成果。</p>
    </div>

    <main class="learning-main learning-container">
        <section class="learning-section" id="learning" aria-labelledby="learning-title">
            <div class="learning-section-head">
                <h2 id="learning-title">學習</h2>
                <span class="learning-count" id="learning-count"></span>
            </div>
            <div class="learning-grid" id="learning-list"></div>
        </section>
        <section class="learning-section" id="works" aria-labelledby="works-title">
            <div class="learning-section-head">
                <h2 id="works-title">作品</h2>
                <span class="learning-count" id="works-count"></span>
            </div>
            <div class="learning-grid" id="works-list"></div>
        </section>
    </main>

    <footer class="learning-footer"><p>學習成果 · 持續學習與創作</p></footer>

    <!-- 依照原始 index.html 的路徑及順序引用 -->
    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script>
        $(function () {
            // 只允許站內相對路徑，避免 JSON 的 URL 被解讀成腳本或外部連結。
            function safePath(value) {
                const path = typeof value === "string" ? value.trim() : "";
                if (!path || /^(?:[a-z][a-z0-9+.-]*:|\/\/|\/|#)/i.test(path) || /[\\\x00-\x1f]/.test(path) || path.split("/").includes("..")) return "";
                return path;
            }

            function formatDate(value) {
                const raw = String(value ?? "").trim();
                if (!raw) return "（未提供日期）";
                return /^\d{8}$/.test(raw) ? raw.slice(0, 4) + "." + raw.slice(4, 6) + "." + raw.slice(6, 8) : raw;
            }

            function makeCard(item) {
                const title = String(item.title || "").trim() || "未命名成品";
                const category = String(item.category || "").trim();
                const note = String(item.note || "").trim();
                const url = safePath(item.url);
                const related = safePath(item.related);
                const image = safePath(item.image);

                const $card = $("<article>").addClass("learning-card");
                const $cover = $("<div>").addClass("learning-cover").attr("data-topic", category);
                if (image) {
                    const $img = $("<img>").attr({ src: image, alt: title + "預覽圖片", loading: "lazy" });
                    $img.on("error", function () {
                        $(this).replaceWith($("<span>").addClass("learning-cover-placeholder").attr("aria-hidden", "true"));
                    });
                    $cover.append($img);
                } else {
                    $cover.append($("<span>").addClass("learning-cover-placeholder").attr("aria-hidden", "true"));
                }

                const $info = $("<div>").addClass("learning-card-info");
                $info.append($("<h3>").text(title));
                const $details = $("<div>").addClass("learning-card-details");
                $details.append($("<p>").addClass("learning-card-description" + (note ? "" : " learning-muted")).text(note || "（無文字說明）"));
                const date = String(item.date ?? "").trim();
                $details.append($("<p>").addClass("learning-card-date" + (date ? "" : " learning-muted")).text(formatDate(date)));
                if (related && related !== url) {
                    const label = item.class === "學習" ? "查看延伸作品 ↗" : "查看原始練習 ↗";
                    // 第二個連結獨立於覆蓋全卡的主連結，不會誤開兩個頁面。
                    $details.append($("<a>").addClass("learning-related").attr({ href: related, target: "_blank", rel: "noopener noreferrer" }).text(label));
                }
                $info.append($details);
                $card.append($cover, $info);
                if (url) {
                    $card.addClass("has-link");
                    $card.append($("<a>").addClass("learning-card-link").attr({ href: url, target: "_blank", rel: "noopener noreferrer", "aria-label": "開啟「" + title + "」" }));
                } else {
                    $details.append($("<span>").addClass("learning-card-date learning-muted").text("（尚無連結）"));
                }
                return $card;
            }

            function renderItems(items, target, countTarget) {
                const $target = $(target).empty();
                $(countTarget).text(items.length + " 項");
                if (!items.length) {
                    $target.append($("<p>").addClass("learning-message").text("目前沒有內容。"));
                    return;
                }
                items.forEach(function (item) { $target.append(makeCard(item)); });
            }

            $.ajax({
                type: "GET",
                url: "index_content.json",
                dataType: "json",
                cache: false,
                success: function (data) {
                    if (!data || !Array.isArray(data.projects)) { showError(); return; }
                    const byDate = (a, b) => String(b.date || "").localeCompare(String(a.date || ""));
                    renderItems(data.projects.filter(x => x.class === "學習").sort(byDate), "#learning-list", "#learning-count");
                    renderItems(data.projects.filter(x => x.class === "作品").sort(byDate), "#works-list", "#works-count");
                },
                error: showError
            });

            function showError() {
                $("#learning-list, #works-list").empty().append(
                    $("<p>").addClass("learning-message").text("無法讀取 index_content.json。請檢查檔案位置，並透過 Live Server 或 GitHub Pages 開啟。")
                );
                $("#learning-count, #works-count").empty();
            }

            // 捲動或點擊分類時，突顯目前所在區塊。
            if ("IntersectionObserver" in window) {
                const observer = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            $(".learning-nav a").removeClass("is-active");
                            $(".learning-nav a[href='#" + entry.target.id + "']").addClass("is-active");
                        }
                    });
                }, { rootMargin: "-20% 0px -55% 0px" });
                document.querySelectorAll(".learning-section").forEach(section => observer.observe(section));
            }
            $(".learning-nav a").on("click", function () {
                $(".learning-nav a").removeClass("is-active");
                $(this).addClass("is-active");
            });
        });
    </script>
</body>
</html>
